<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
  <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-6 flex flex-col gap-4">
    <!-- Panel Header -->
    <div class="flex items-center justify-between pb-3">
      <div>
        <h3 class="text-xl font-bold text-gray-800">{{ character.name }}</h3>
        <p class="text-xs text-gray-500">{{ character.species }}</p>
      </div>
      <button
        (click)="close()"
        class="text-gray-400 hover:text-gray-600 font-bold text-xl px-2 rounded-lg"
      >
        ✕
      </button>
    </div>

    <!-- Canvas Area -->
    <div class="relative overflow-hidden flex items-center justify-center">
      <canvas
        #canvas
        (mousedown)="onMouseDown($event)"
        (mousemove)="onMouseMove($event)"
        (mouseup)="onMouseUp()"
        class="cursor-crosshair border border-gray-700 max-w-full max-h-full"
      ></canvas>
    </div>

    <!-- Panel -->
    <div class="flex flex-col items-start justify-between pt-2 text-sm gap-2">
      <div class="flex gap-2">
        <button
          (click)="finishPolygon()"
          [disabled]="currentPoints.length < 3"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 transition-colors"
        >
          Finish Polygon
        </button>
        <button
          (click)="clearCurrent()"
          class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors"
        >
          Clear
        </button>
      </div>
      <p class="text-xs text-gray-500">
        LMB: place point / click on polygon for Drag&Drop / hold Alt to rotate
      </p>
    </div>
  </div>
</div>
