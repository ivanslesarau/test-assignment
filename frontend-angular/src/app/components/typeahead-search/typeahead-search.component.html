<div class="search-container max-w-2xl mx-auto my-8 p-4 font-sans">
  <!-- Input field -->
  <div class="relative">
    <input
      type="text"
      [formControl]="searchInput"
      (focus)="showSuggestions = true"
      (blur)="hideSuggestionsWithDelay()"
      placeholder="Input character name..."
      class="w-full px-4 py-3 text-base border-2 border-gray-300 rounded-lg outline-none transition-colors duration-200 focus:border-blue-500 shadow-sm"
    />

    <!-- Hints -->
    <ul
      *ngIf="showSuggestions && (suggestions$ | async) as suggestions"
      [class.hidden]="suggestions.length === 0"
      class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-b-lg shadow-lg z-20 max-h-60 overflow-y-auto divide-y divide-gray-100"
    >
      <li
        *ngFor="let item of suggestions"
        (mousedown)="selectSuggestion(item.query)"
        class="px-4 py-2.5 cursor-pointer hover:bg-gray-100 text-gray-700 text-sm flex items-center gap-2 transition-colors duration-150"
      >
        <span>{{ item.query }}</span>
      </li>
    </ul>
  </div>

  <!-- Virtual Scroll -->
  <div class="mt-4 relative">
    <cdk-virtual-scroll-viewport
      itemSize="72"
      class="h-[800px] w-full border border-gray-300 rounded-lg bg-white shadow-inner"
      (scrolledIndexChange)="onScrollIndexChange($event)"
    >
      <div
        *cdkVirtualFor="let item of results$ | async"
        class="flex items-center h-[72px] px-4 border-b border-gray-100 cursor-pointer hover:bg-gray-50 transition-colors duration-150"
        (click)="openImageDialog(item)"
      >
        <img
          [src]="item.imageUrl"
          [alt]="item.name"
          class="w-12 h-12 rounded-full object-cover mr-4 border border-gray-200 shadow-sm"
        />
        <div class="flex flex-col">
          <span class="font-semibold text-gray-800 text-base leading-snug">{{ item.name }}</span>
          <span class="text-xs text-gray-500 leading-normal">{{ item.species }}</span>
        </div>
      </div>
    </cdk-virtual-scroll-viewport>

    <!-- Loader -->
    <div
      *ngIf="isLoading$ | async"
      class="absolute inset-0 bg-white/70 backdrop-blur-[1px] flex items-center justify-center font-medium text-blue-600 rounded-lg z-10"
    >
      <div class="flex items-center gap-2">
        <svg
          class="animate-spin h-5 w-5 text-blue-600"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        <span>Loading...</span>
      </div>
    </div>
  </div>
</div>

@if (selectedCharacter) {
  <app-image-dialog
    [character]="selectedCharacter"
    (closeDialog)="closeImageDialog()"
  ></app-image-dialog>
}
